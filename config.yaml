# ===================== CONFIG FILE =====================
# Central place for all paths & settings. Change values here
# instead of hunting through the code.

data:
  raw_path: "data/train.csv"
  target_column: "SalePrice"
  test_size: 0.2
  random_state: 42

model:
  save_path: "models/house_price_model.pkl"
  preprocessor_path: "models/preprocessor.pkl"

training:
  cv_folds: 5
  scoring: "neg_root_mean_squared_error"

  # Hyperparameter search space for Ridge Regression
  # Ridge = Linear Regression + L2 regularization. Penalizes large
  # coefficients, which helps a lot when features are correlated
  # (e.g. TotalSF, GrLivArea, TotalBsmtSF all overlap in meaning).
  ridge:
    alpha: [0.1, 1.0, 10.0, 50.0, 100.0]

  # Hyperparameter search space for RandomForest
  # NOTE: max_features added - without it RF tends to overfit on datasets
  # with lots of one-hot encoded columns (uses every column at every split).
  random_forest:
    n_estimators: [300, 500, 800]
    max_depth: [10, 15, 20, null]
    min_samples_split: [2, 4, 6]
    max_features: ["sqrt", "log2"]

  # Hyperparameter search space for XGBoost
  xgboost:
    n_estimators: [300, 500, 800]
    max_depth: [3, 5, 7]
    learning_rate: [0.01, 0.05, 0.1]
    subsample: [0.7, 0.85, 1.0]

  # Hyperparameter search space for CatBoost
  # CatBoost handles categorical columns very well natively, and this
  # dataset has many categorical columns, so it's worth trying alongside XGBoost.
  catboost:
    iterations: [500, 800, 1200]
    depth: [4, 6, 8]
    learning_rate: [0.01, 0.05, 0.1]

  # Outlier removal strictness (IQR multiplier). Lower = stricter.
  outlier_factor: 2.5
